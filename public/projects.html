<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your projects · UMLforge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='4' fill='%2324211b'/%3E%3Cg fill='none' stroke='%23fbf8f0' stroke-width='1.7'%3E%3Crect x='3.5' y='3.5' width='5' height='5'/%3E%3Crect x='11.5' y='11.5' width='5' height='5'/%3E%3Cpath d='M8.5 8.5l3 3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="site">
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="./">
        <div class="brandMark"><svg viewBox="0 0 20 20" fill="none" stroke="#fbf8f0" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1"/><rect x="11.5" y="11.5" width="6" height="6" rx="1"/><path d="M8.5 8.5l3 3"/></svg></div>
        <div>UMLforge</div>
      </a>
      <div class="links">
        <a href="projects.html" aria-current="page">Your projects</a>
        <a class="cta" href="editor.html?project=new">New diagram</a>
      </div>
    </nav>

    <section class="block">
      <div class="rowHead"><h2>Your projects <span class="note" id="count"></span></h2></div>
      <div class="toolbarRow">
        <input class="textInput search" id="search" type="search" placeholder="Search projects" aria-label="Search projects">
        <a class="btn small primary" href="editor.html?project=new">New project</a>
        <button class="btn small secondary" id="importBtn">Import JSON</button>
        <input type="file" id="fileInput" accept="application/json,.json" hidden>
      </div>
      <p class="note">Projects are saved in this browser only. Export a project to back it up or open it on another device.</p>
      <div class="cards" id="cards"></div>
      <div class="empty" id="empty" hidden>
        <p>No projects yet.</p>
        <a class="btn primary" href="editor.html?project=new">Start your first diagram</a>
      </div>
    </section>
  </div>
  <script type="module" src="js/projects-page.js"></script>
</body>
</html>
